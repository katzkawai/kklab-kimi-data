  vis.forEach(s => {
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.8; ctx.beginPath();
    s.points.forEach((v, j) => { const x = X(j), y = Y(v); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  });
}
new ResizeObserver(draw).observe(canvas);
draw();
</script>
